<!DOCTYPE html>
<html lang="pt">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>Pretholas - Finalizar Pagamento</title>

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

body {
    background: #ffffff;
    color: #ffffff;
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    padding: 20px;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}

.container {
    max-width: 500px;
    width: 100%;
    margin: auto;
}

.checkout-card {
    background: linear-gradient(135deg, #00d728, #00b922);
    border-radius: 25px;
    padding: 30px;
    box-shadow: 0 0 30px rgba(0,0,0,0.3);
    animation: fadeInUp 0.5s ease;
    border: 1px solid rgba(255,255,255,0.3);
}

@keyframes fadeInUp {
    from {
        opacity: 0;
        transform: translateY(30px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.logo {
    text-align: center;
    font-size: 2rem;
    font-weight: bold;
    color: #fff;
    text-shadow: 2px 2px 4px rgba(0,0,0,0.3);
    margin-bottom: 5px;
}

.subtitle {
    text-align: center;
    color: #ffffff;
    margin-bottom: 30px;
    font-size: 0.85rem;
}

.form-group {
    margin-bottom: 20px;
}

label {
    display: block;
    margin-bottom: 8px;
    color: #0a0a0a;
    font-weight: bold;
    font-size: 0.9rem;
}

input, textarea {
    width: 100%;
    padding: 12px 15px;
    background: #0a0a0a;
    border: 1px solid #333;
    border-radius: 12px;
    color: white;
    font-size: 1rem;
    transition: 0.3s;
    font-family: inherit;
}

input:focus, textarea:focus {
    outline: none;
    border-color: #00ff9c;
    box-shadow: 0 0 10px rgba(0,255,156,0.3);
}

textarea {
    resize: vertical;
    min-height: 80px;
}

.order-summary {
    background: rgba(0,0,0,0.2);
    padding: 12px;
    border-radius: 12px;
    margin-bottom: 20px;
    text-align: center;
}

.order-summary p {
    margin: 5px 0;
    font-size: 0.85rem;
}

.btn-primary {
    width: 100%;
    padding: 15px;
    background: linear-gradient(90deg, #ff004f, #8000ff);
    border: none;
    border-radius: 12px;
    color: white;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 10px;
}

.btn-primary:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 20px rgba(255,0,79,0.4);
}

.cta-buttons {
    display: flex;
    flex-direction: column;
    gap: 20px;
    margin-bottom: 30px;
}

.cta-mpesa, .cta-emola {
    padding: 25px;
    border-radius: 20px;
    text-align: center;
    cursor: pointer;
    transition: 0.3s;
    border: 2px solid;
}

.cta-mpesa {
    background: linear-gradient(135deg, #4CAF50, #2E7D32);
    border-color: #ffffff;
}

.cta-emola {
    background: linear-gradient(135deg, #2196F3, #0b5e7e);
    border-color: #ffffff;
}

.cta-mpesa:hover, .cta-emola:hover {
    transform: scale(1.02);
    box-shadow: 0 10px 30px rgba(0,255,156,0.3);
}

.cta-mpesa h2, .cta-emola h2 {
    font-size: 1.8rem;
    margin-bottom: 10px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
}

.cta-mpesa p, .cta-emola p {
    font-size: 0.9rem;
    opacity: 0.9;
}

.payment-info {
    background: rgba(0,0,0,0.8);
    border-radius: 20px;
    padding: 20px;
    margin-top: 20px;
    animation: slideDown 0.3s ease;
}

@keyframes slideDown {
    from {
        opacity: 0;
        transform: translateY(-20px);
    }
    to {
        opacity: 1;
        transform: translateY(0);
    }
}

.payment-info h3 {
    color: #00ff9c;
    text-align: center;
    margin-bottom: 15px;
}

.copy-number {
    background: linear-gradient(135deg, #c8fcce, #c3fac9);
    border: 2px dashed #ff004f;
    border-radius: 15px;
    padding: 20px;
    text-align: center;
    margin-bottom: 20px;
    cursor: pointer;
    transition: 0.3s;
}

.copy-number:hover {
    border-color: #ffffff;
    transform: scale(1.02);
}

.copy-number .numero {
    font-size: 2rem;
    font-weight: bold;
    letter-spacing: 2px;
    color: #c00000;
    margin: 10px 0;
}

.copy-number small {
    color: #c00000;
    font-size: 0.75rem;
}

.btn-pagar-agora {
    width: 100%;
    padding: 15px;
    background: #ff004f;
    border: none;
    border-radius: 12px;
    color: white;
    font-weight: bold;
    font-size: 1.1rem;
    cursor: pointer;
    transition: 0.3s;
    margin-bottom: 15px;
}

.btn-pagar-agora:hover {
    background: #cc0040;
    transform: scale(1.02);
}

.confirmacao-area {
    background: rgba(0,0,0,0.5);
    border-radius: 12px;
    padding: 15px;
    margin: 15px 0;
}

.confirmacao-area label {
    color: white;
    margin-bottom: 10px;
    display: block;
}

.confirmacao-texto {
    width: 100%;
    min-height: 100px;
    background: #1a1a1a;
    border: 1px solid #00ff9c;
    border-radius: 10px;
    color: #00ff9c;
    padding: 12px;
    font-family: monospace;
    font-size: 0.85rem;
}

.confirmacao-texto:focus {
    outline: none;
    border-color: #ff004f;
}

.btn-confirmar-pedido {
    width: 100%;
    padding: 15px;
    background: #00ff9c;
    border: none;
    border-radius: 12px;
    color: #000000;
    font-weight: bold;
    font-size: 1rem;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 10px;
}

.btn-confirmar-pedido:hover:not(:disabled) {
    background: #00cc7a;
    transform: scale(1.02);
}

.btn-confirmar-pedido:disabled {
    background: #666;
    cursor: not-allowed;
}

.notification {
    position: fixed;
    bottom: 20px;
    left: 20px;
    right: 20px;
    max-width: 400px;
    margin: 0 auto;
    background: #1a1a1a;
    border-left: 4px solid #00ff9c;
    padding: 15px 20px;
    border-radius: 12px;
    box-shadow: 0 5px 20px rgba(0,0,0,0.5);
    transform: translateX(-120%);
    transition: transform 0.3s ease;
    z-index: 1000;
    display: flex;
    align-items: center;
    gap: 12px;
}

.notification.show {
    transform: translateX(0);
}

.notification-icon {
    font-size: 1.5rem;
}

.notification-content {
    flex: 1;
}

.notification-title {
    font-weight: bold;
    margin-bottom: 4px;
    color: #00ff9c;
}

.notification-message {
    font-size: 0.85rem;
    color: #ccc;
}

.notification-close {
    cursor: pointer;
    font-size: 1.2rem;
    color: #888;
}

.btn-voltar {
    width: 100%;
    padding: 12px;
    background: transparent;
    border: 1px solid #333;
    border-radius: 12px;
    color: #ffffff;
    cursor: pointer;
    transition: 0.3s;
    margin-top: 15px;
}

.btn-voltar:hover {
    border-color: #ff004f;
    color: #ff004f;
}

.hidden {
    display: none;
}

.loading {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid white;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
}

@keyframes spin {
    to { transform: rotate(360deg); }
}

@media (max-width: 600px) {
    .checkout-card {
        padding: 20px;
    }
    .cta-mpesa h2, .cta-emola h2 {
        font-size: 1.4rem;
    }
    .copy-number .numero {
        font-size: 1.5rem;
    }
}
</style>
</head>

<body>

<div class="container">
    <div class="checkout-card">
        
        <div class="logo">PRETHOLAS</div>
        <div class="subtitle">Complete seu pagamento</div>
        
        <div id="formSection">
            <form id="paymentForm">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="nome" placeholder="Digite seu nome" required>
                </div>
                
                <div class="form-group">
                    <label>Número de Telefone (WhatsApp)</label>
                    <input type="tel" id="telefone" placeholder="84 123 4567" required>
                </div>
                
                <div class="form-group">
                    <label>Produtos</label>
                    <textarea id="servico" placeholder="Ex: Camisa Liverpool tamanho M, Bola de Futebol..." required></textarea>
                </div>
                
                <div class="order-summary" id="orderSummary">
                    <p><strong>Seu Pedido</strong></p>
                    <p id="summaryText">Aguardando preenchimento...</p>
                </div>
                
                <button type="submit" class="btn-primary">
                    💳 Continuar para Pagamento
                </button>
            </form>
        </div>
        
        <div id="paymentSection" class="hidden">
            <div class="cta-buttons">
                <div class="cta-mpesa" onclick="mostrarInfoPagamento('mpesa')">
                    <h2>📱 M-Pesa</h2>
                    <p>Pagamentos M-Pesa indisponíveis</p>
                </div>
                
                <div class="cta-emola" onclick="mostrarInfoPagamento('emola')">
                    <h2>💳 e-Mola</h2>
                    <p>Clique para pagar com e-Mola</p>
                </div>
            </div>
            <div id="paymentInfo" class="hidden"></div>
            <button class="btn-voltar" onclick="voltarAoFormulario()">↩️ Voltar e alterar dados</button>
        </div>
        
    </div>
</div>

<div id="notification" class="notification">
    <div class="notification-icon">ℹ️</div>
    <div class="notification-content">
        <div class="notification-title">Dica Rápida</div>
        <div class="notification-message">Clique no número para copiar, depois clique em "Pagar Agora"</div>
    </div>
    <div class="notification-close" onclick="fecharNotificacao()">✕</div>
</div>

<script>
// ===== CONFIGURAÇÃO DA API (RENDER) =====
const API_URL = 'https://pretholas-backend.onrender.com/api';

// Variáveis globais
let pedidoData = {
    nome: '',
    telefone: '',
    servico: ''
};

let metodoPagamentoAtual = '';
let pedidoEnviado = false;
let pedidoId = null;

// Elementos DOM
const formSection = document.getElementById('formSection');
const paymentSection = document.getElementById('paymentSection');
const paymentForm = document.getElementById('paymentForm');
const paymentInfo = document.getElementById('paymentInfo');

// ===== FUNÇÕES DE NOTIFICAÇÃO =====
function mostrarNotificacao(titulo, mensagem, tipo = 'info') {
    const notification = document.getElementById('notification');
    const icon = notification.querySelector('.notification-icon');
    const title = notification.querySelector('.notification-title');
    const message = notification.querySelector('.notification-message');
    
    if (tipo === 'success') {
        icon.innerHTML = '✅';
        title.style.color = '#00ff9c';
    } else if (tipo === 'warning') {
        icon.innerHTML = '⚠️';
        title.style.color = '#ffaa00';
    } else if (tipo === 'error') {
        icon.innerHTML = '❌';
        title.style.color = '#ff004f';
    } else {
        icon.innerHTML = 'ℹ️';
        title.style.color = '#00ff9c';
    }
    
    title.innerHTML = titulo;
    message.innerHTML = mensagem;
    
    notification.classList.add('show');
    setTimeout(() => fecharNotificacao(), 5000);
}

function fecharNotificacao() {
    const notification = document.getElementById('notification');
    notification.classList.remove('show');
}

// ===== FUNÇÕES DO FORMULÁRIO =====
function validarFormulario() {
    pedidoData.nome = document.getElementById('nome').value.trim();
    pedidoData.telefone = document.getElementById('telefone').value.trim();
    pedidoData.servico = document.getElementById('servico').value.trim();
    
    if (!pedidoData.nome || !pedidoData.telefone || !pedidoData.servico) {
        mostrarNotificacao('Campos incompletos', 'Por favor, preencha todos os campos!', 'error');
        return false;
    }
    
    const telefoneRegex = /^[8|7][0-9]{8}$/;
    if (!telefoneRegex.test(pedidoData.telefone.replace(/\s/g, ''))) {
        mostrarNotificacao('Número inválido', 'Use 84xxxxxxx ou 87xxxxxxx (9 dígitos)', 'error');
        return false;
    }
    
    return true;
}

function continuarParaPagamento() {
    if (!validarFormulario()) return;
    
    formSection.classList.add('hidden');
    paymentSection.classList.remove('hidden');
    mostrarNotificacao('Pedido registrado!', `Olá ${pedidoData.nome}, escolha como deseja pagar abaixo.`, 'success');
}

// ===== FUNÇÕES DE PAGAMENTO =====
function mostrarInfoPagamento(metodo) {
    if (metodo === 'mpesa') {
        mostrarNotificacao('Indisponível', 'M-Pesa está temporariamente indisponível. Use e-Mola.', 'warning');
        return;
    }
    
    metodoPagamentoAtual = metodo;
    const numero = '879964482';
    const nomeMetodo = 'e-Mola';
    
    const infoHTML = `
        <div class="payment-info">
            <h3>💰 Pagar com ${nomeMetodo}</h3>
            
            <div class="copy-number" onclick="copiarNumero('${numero}')">
                <div class="numero">${numero.slice(0,3)} ${numero.slice(3,6)} ${numero.slice(6,9)}</div>
                <small>Clique aqui para copiar</small>
            </div>
            
            <button class="btn-pagar-agora" onclick="pagarAgora()">
                📞 Pagar Agora (${nomeMetodo})
            </button>
            
            <div class="confirmacao-area">
                <label>📋 Cole aqui a mensagem de confirmação do pagamento:</label>
                <textarea id="mensagemConfirmacao" class="confirmacao-texto" placeholder="Ex: Confirmação de pagamento - Pedido #123 - 500MT - Código: ABC123..."></textarea>
            </div>
            
            <button class="btn-confirmar-pedido" id="btnConfirmarPedido" onclick="confirmarPedido()">
                ✅ CONFIRMAR PEDIDO
            </button>
            
            <button class="btn-voltar" onclick="voltarParaCTAs()" style="margin-top: 15px;">
                ↩️ Voltar para opções de pagamento
            </button>
        </div>
    `;
    
    paymentInfo.innerHTML = infoHTML;
    paymentInfo.classList.remove('hidden');
    paymentInfo.scrollIntoView({ behavior: 'smooth', block: 'center' });
    
    mostrarNotificacao('Como pagar', '1️⃣ Copie o número\n2️⃣ Clique em "Pagar Agora"\n3️⃣ Envie o valor\n4️⃣ Cole a mensagem de confirmação\n5️⃣ Clique em Confirmar Pedido', 'info');
}

function voltarParaCTAs() {
    paymentInfo.classList.add('hidden');
    paymentInfo.innerHTML = '';
    document.querySelector('.cta-buttons').scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function copiarNumero(numero) {
    navigator.clipboard.writeText(numero).then(() => {
        mostrarNotificacao('Número copiado!', `${numero} copiado com sucesso!`, 'success');
    }).catch(() => {
        const textarea = document.createElement('textarea');
        textarea.value = numero;
        document.body.appendChild(textarea);
        textarea.select();
        document.execCommand('copy');
        document.body.removeChild(textarea);
        mostrarNotificacao('Número copiado!', `${numero} copiado!`, 'success');
    });
}

function pagarAgora() {
    mostrarNotificacao('Abrindo e-Mola', 'O aplicativo de telefone será aberto para completar o pagamento.', 'info');
    window.location.href = 'tel:*898#';
}

function confirmarPedido() {
    if (pedidoEnviado) {
        mostrarNotificacao('⚠️ Pedido já confirmado', 'Seu pedido já foi registrado e enviado para aprovação.', 'warning');
        return;
    }
    
    const mensagemConfirmacao = document.getElementById('mensagemConfirmacao')?.value.trim();
    
    if (!mensagemConfirmacao) {
        mostrarNotificacao('❌ Mensagem obrigatória', 'Por favor, cole a mensagem de confirmação do pagamento antes de continuar.', 'error');
        document.getElementById('mensagemConfirmacao').focus();
        document.getElementById('mensagemConfirmacao').style.border = '2px solid #ff004f';
        return;
    }
    
    document.getElementById('mensagemConfirmacao').style.border = '';
    
    const btnConfirmar = document.getElementById('btnConfirmarPedido');
    if (btnConfirmar) {
        btnConfirmar.disabled = true;
        btnConfirmar.innerHTML = '<span class="loading"></span> Enviando...';
    }
    
    let carrinho = localStorage.getItem('pretholas-carrinho');
    let total = 0;
    let produtosTexto = '';
    
    if (carrinho) {
        carrinho = JSON.parse(carrinho);
        carrinho.forEach(item => {
            total += item.preco * item.quantidade;
            produtosTexto += `${item.nome} x ${item.quantidade}\n`;
        });
    }
    
    const pedido = {
        nome: pedidoData.nome,
        telefone: pedidoData.telefone,
        produtos: produtosTexto,
        total: total,
        metodoPagamento: 'e-Mola',
        status: 'pendente',
        mensagemConfirmacao: mensagemConfirmacao
    };
    
    mostrarNotificacao('📡 Enviando pedido...', 'Aguarde, registrando seu pedido no sistema.', 'info');
    
    fetch(`${API_URL}/pedidos`, {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(pedido)
    })
    .then(res => res.json())
    .then(data => {
        if (data.sucesso) {
            pedidoEnviado = true;
            pedidoId = data.pedido.id;
            localStorage.removeItem('pretholas-carrinho');
            
            mostrarNotificacao('✅ Pedido registrado!', `Pedido #${data.pedido.id} registrado! Aguarde aprovação.`, 'success');
            
            setTimeout(() => {
                mostrarNotificacao('⏰ Prazo de Atendimento', 'Aguarde até 48h. Caso não seja atendido, contacte: 852158504', 'warning');
            }, 3000);
            
            setTimeout(() => {
                window.location.href = 'index.html';
            }, 8000);
        } else {
            throw new Error('Falha no registro');
        }
    })
    .catch(error => {
        console.error('Erro:', error);
        mostrarNotificacao('Erro', 'Erro de conexão com o servidor.', 'error');
        if (btnConfirmar) {
            btnConfirmar.disabled = false;
            btnConfirmar.innerHTML = '✅ CONFIRMAR PEDIDO';
        }
    });
}

function voltarAoFormulario() {
    formSection.classList.remove('hidden');
    paymentSection.classList.add('hidden');
    paymentInfo.classList.add('hidden');
    paymentInfo.innerHTML = '';
    mostrarNotificacao('Voltando', 'Você pode alterar os dados do seu pedido.', 'info');
    formSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

function atualizarResumo() {
    const nome = document.getElementById('nome')?.value;
    const servico = document.getElementById('servico')?.value;
    const summaryText = document.getElementById('summaryText');
    
    if (nome && servico && summaryText) {
        summaryText.innerHTML = `👤 ${nome}<br>📦 ${servico.substring(0, 50)}...`;
    } else if (summaryText) {
        summaryText.innerHTML = 'Aguardando preenchimento...';
    }
}

// Event Listeners
if (paymentForm) {
    paymentForm.addEventListener('submit', (e) => {
        e.preventDefault();
        continuarParaPagamento();
    });
}

if (document.getElementById('nome') && document.getElementById('servico')) {
    document.getElementById('nome').addEventListener('input', atualizarResumo);
    document.getElementById('servico').addEventListener('input', atualizarResumo);
}

setTimeout(() => {
    mostrarNotificacao('Bem-vindo!', 'Preencha o formulário para continuar.', 'info');
}, 1000);
</script>
</body>
</html>
